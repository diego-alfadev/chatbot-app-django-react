services:
  db:
    container_name: db
    image: postgres:17.2
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chat_app
    volumes:
      - ./db:/var/lib/postgresql/data

  app:
    container_name: app
    build:
      context: ./chatbot-app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./chatbot-app:/app
      - app_node_modules:/app/node_modules
    depends_on:
      - backend

  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/backend
    depends_on:
      - db


volumes:
  app_node_modules:
